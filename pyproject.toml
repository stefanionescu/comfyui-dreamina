[project]
name = "dreamina"
version = "0.1.0"
description = "Use Dreamina's image, video, and audio models in ComfyUI with your own Dreamina account."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [{ name = "Stefan Ionescu" }]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10,<3",
]

[dependency-groups]
dev = [
    "aiohttp>=3.12,<4",
    "import-linter",
]

[tool.deptry]
ignore_notebooks = true
# ComfyUI supplies these modules. mise run deps puts the ComfyUI install on the project path, so deptry finds them there.
per_rule_ignores.DEP003 = [
    "aiohttp",
    "comfy",
    "comfy_api",
    "comfy_api_nodes",
    "comfy_execution",
    "folder_paths",
    "nodes",
    "server",
    "torch",
]
per_rule_ignores.DEP004 = ["aiohttp"]
known_first_party = ["scripts", "src"]

[tool.comfy]
DisplayName = "Dreamina"
Icon = "https://raw.githubusercontent.com/stefanionescu/comfyui-dreamina/main/docs/images/brand/logo.png"
requires-comfyui = ">=0.37.2"

[tool.importlinter]
root_packages = ["src"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the host packages import ComfyUI's modules"
type = "forbidden"
allow_indirect_imports = true
# The node classes and the comfy package are the host boundary: ComfyUI calls them and they speak its types.
source_modules = [
    "src.config",
    "src.dreamina",
    "src.settings",
    "src.storage",
    "src.state",
]
forbidden_modules = [
    "comfy",
    "comfy_api",
    "comfy_api_nodes",
    "comfy_execution",
    "comfy_extras",
    "folder_paths",
    "node_helpers",
    "nodes",
    "server",
]
